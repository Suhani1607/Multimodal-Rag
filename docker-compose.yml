services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multimodal_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-knowledge_platform}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-knowledge_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: multimodal_rag_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: multimodal_rag_ai_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=production
      - FASTAPI_PORT=8000
      - DATABASE_URL=postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-knowledge_platform}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-llama-3.2-11b-vision-preview}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - COHERE_RERANK_MODEL=${COHERE_RERANK_MODEL:-rerank-english-v3.0}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-super-secret-internal-token-change-in-prod}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/storage
    volumes:
      - storage_uploads:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: multimodal_rag_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "-c", "2"]
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-knowledge_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/storage
    volumes:
      - storage_uploads:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: multimodal_rag_spring_api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DATABASE_NAME:-knowledge_platform}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - FASTAPI_URL=http://ai-service:8000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-super-secret-internal-token-change-in-prod}
      - STORAGE_LOCATION=/storage
    volumes:
      - storage_uploads:/storage
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multimodal_rag_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://localhost:8081/api/v1
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      - backend-spring

volumes:
  postgres_data:
  storage_uploads:
